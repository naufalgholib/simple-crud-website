services:
  database:
    image: mysql:8.4
    container_name: crud-database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crud_db
      MYSQL_USER: ${MYSQL_USER:-crud_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-crud_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-2G}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-151}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - crud-network

  backend:
    build:
      context: ./backend
    container_name: crud-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: crud_db
      DB_USER: ${MYSQL_USER:-crud_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-crud_password}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      database:
        condition: service_healthy
        restart: true
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - crud-network

  frontend:
    build:
      context: ./frontend
    container_name: crud-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - crud-network

volumes:
  mysql_data:

networks:
  crud-network:
    driver: bridge
